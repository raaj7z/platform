services:
  - type: web
    name: pralayx-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: PRALAYX_DB_PATH
        value: data/pralayx.db
