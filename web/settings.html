<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRALAYX — System Settings</title>
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar"><!-- Nav rendered by app.js --></aside>
    <main class="main">
      <div id="investigation-context-root"></div>

      <div class="header-title" style="display:flex;justify-content:space-between;align-items:flex-end">
        <div>
          <span class="kicker">CONFIGURATION & INTEGRATIONS</span>
          <h1>Platform System Settings</h1>
          <p>Configure Tor proxy parameters, OSINT API provider keys, and database maintenance utilities.</p>
        </div>
      </div>

      <section class="panel panel-pad">
        <div class="grid g2" style="margin-bottom:16px">
          <div>
            <label class="form-label">Tor SOCKS5 Proxy Host</label>
            <input class="input" value="127.0.0.1" readonly>
          </div>
          <div>
            <label class="form-label">Tor SOCKS5 Port</label>
            <input class="input" value="9050" readonly>
          </div>
        </div>
        <div style="display:flex;gap:10px">
          <button id="btn-test-tor" class="btn primary sm">Test Tor Connection</button>
          <button id="btn-vacuum-db" class="btn ghost sm">Optimize Database</button>
        </div>
        <div id="settings-status" style="margin-top:10px"></div>
      </section>
    </main>
  </div>
  <script src="/web/app.js"></script>
</body>
</html>
