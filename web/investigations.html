<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRALAYX — Investigations Registry</title>
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar"><!-- Nav rendered by app.js --></aside>
    <main class="main">
      <div id="investigation-context-root"></div>

      <div class="header-title" style="display:flex;justify-content:space-between;align-items:flex-end">
        <div>
          <span class="kicker">CASE MANAGEMENT</span>
          <h1>Investigations Registry</h1>
          <p>All active and completed threat intelligence investigations. Click any case to open its workspace.</p>
        </div>
        <button id="btn-new-investigation" class="btn primary">+ New Investigation</button>
      </div>

      <!-- New Investigation Form -->
      <section id="new-inv-form" class="panel panel-pad hidden" style="margin-bottom:16px">
        <h3 style="margin:0 0 12px 0;font-size:14px">Create New Investigation</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr 160px 140px;gap:10px;align-items:end">
          <div>
            <label class="form-label">Target (URL, Handle, Domain)</label>
            <input class="input" id="new-inv-target" placeholder="http://example.onion or @handle" required>
          </div>
          <div>
            <label class="form-label">Notes (Optional)</label>
            <input class="input" id="new-inv-notes" placeholder="Case notes, priority, etc.">
          </div>
          <div>
            <label class="form-label">Initial Action</label>
            <select class="select" id="new-inv-mode">
              <option value="crawl">Dark Web Crawl</option>
              <option value="osint">OSINT Scan</option>
              <option value="investigation">Investigation Record Only</option>
            </select>
          </div>
          <button class="btn primary" id="btn-create-investigation" style="height:36px">Create Case</button>
        </div>
        <div id="new-inv-error" class="notice hidden" style="margin-top:8px"></div>
      </section>

      <!-- Table Section -->
      <section class="panel">
        <div class="panel-head">
          <div><span class="kicker">ALL CASES</span><h2>Active Investigations</h2></div>
          <span id="inv-count" class="badge blue">LOADING...</span>
        </div>
        <div class="table-container">
          <table class="table">
            <thead>
              <tr><th>Case ID</th><th>Target</th><th>Status</th><th>Source</th><th>Created</th><th>Updated</th><th>Actions</th></tr>
            </thead>
            <tbody id="inv-tbody">
              <tr><td colspan="7"><div class="skeleton skeleton-line wide"></div><div class="skeleton skeleton-line med"></div></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
  <script src="/web/app.js"></script>
</body>
</html>
