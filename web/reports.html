<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRALAYX — Final Reports & Dossiers</title>
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar"><!-- Nav rendered by app.js --></aside>
    <main class="main">
      <div id="investigation-context-root"></div>

      <div class="header-title" style="display:flex;justify-content:space-between;align-items:flex-end">
        <div>
          <span class="kicker">FORENSIC ARTIFACT EXPORT</span>
          <h1>Reports & Dossiers Export</h1>
          <p>Generate court-admissible forensic intelligence dossiers in PDF, HTML, JSON, and CSV formats.</p>
        </div>
      </div>

      <section class="panel panel-pad" style="margin-bottom:16px">
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
          <span style="font-weight:700;font-size:13px">Export Current Case:</span>
          <a id="export-pdf" href="#" class="btn primary sm">PDF Dossier</a>
          <a id="export-html" href="#" class="btn secondary sm">HTML Report</a>
          <a id="export-json" href="#" class="btn ghost sm">JSON Bundle</a>
          <a id="export-csv" href="#" class="btn ghost sm">CSV Indicators</a>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head"><div><span class="kicker">ARCHIVED REPORTS</span><h2>Generated Dossiers</h2></div></div>
        <div id="reports-list" class="panel-pad"></div>
      </section>
    </main>
  </div>
  <script src="/web/app.js"></script>
</body>
</html>
