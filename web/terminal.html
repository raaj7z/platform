<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRALAYX — Live Terminal Stream</title>
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar"><!-- Nav rendered by app.js --></aside>
    <main class="main">
      <div id="investigation-context-root"></div>

      <div class="header-title" style="display:flex;justify-content:space-between;align-items:flex-end">
        <div>
          <span class="kicker">SYSTEM LOG STREAM</span>
          <h1>Live Investigation Terminal</h1>
          <p>Real-time crawler execution events, proxy connection handshakes, and OSINT task output.</p>
        </div>
        <span class="badge green">SOCKET ONLINE</span>
      </div>

      <section class="panel">
        <div class="terminal" id="terminal-stream" style="min-height:500px">
          <span class="terminal-line info">[PRALAYX SYSTEM] Terminal initialized. Awaiting engine events...</span>
        </div>
      </section>
    </main>
  </div>
  <script src="/web/app.js"></script>
</body>
</html>
