<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRALAYX — Continuous Monitoring & Alerts</title>
  <link rel="stylesheet" href="/web/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar"><!-- Nav rendered by app.js --></aside>
    <main class="main">
      <div id="investigation-context-root"></div>

      <div class="header-title" style="display:flex;justify-content:space-between;align-items:flex-end">
        <div>
          <span class="kicker">PERSISTENT SURVEILLANCE</span>
          <h1>Monitoring Watchlist & Real-Time Alerts</h1>
          <p>Automated periodic surveillance of target onion services and real-time alerts on OpSec modifications.</p>
        </div>
        <button id="btn-add-watch" class="btn primary">+ Add Watch Target</button>
      </div>

      <div class="grid g2">
        <section class="panel">
          <div class="panel-head"><div><span class="kicker">WATCHLIST</span><h2>Monitored Darknet Targets</h2></div></div>
          <div id="monitoring-list" class="panel-pad"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><div><span class="kicker">SECURITY TRIGGERS</span><h2>Live Alerts Stream</h2></div></div>
          <div id="alerts-list" class="panel-pad"></div>
        </section>
      </div>
    </main>
  </div>
  <script src="/web/app.js"></script>
</body>
</html>
